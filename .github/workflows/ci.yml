name: BNB-QUSD Continuous Integration & Universal Reality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Reject high/critical production dependency advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Compile Solidity Contracts
        run: npm run compile

      - name: Run Core Invariant Tests
        run: npm test

      - name: Run Quantum Portfolio Optimization Invariant Tests
        run: npm run test:quantum

      - name: Run NIST FIPS 203 & 204 PQC Cryptographic Tests
        run: npm run test:nist

      - name: Run Adversarial & Fuzz Invariant Tests
        run: npm run test:fuzz

      - name: Run Repository Security Scan
        run: npm run audit:security

      - name: Run Master Universal Reality Gate
        run: npm run reality:all
