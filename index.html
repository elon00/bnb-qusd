<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="description" content="BNB-QUSD — Quantum-Resilient Stablecoin & Intelligent Ecosystem Terminal on BNB Chain">
<title>BNB-QUSD — Quantum Stablecoin & Web4 Terminal</title>
<!-- Telegram WebApp SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0b0e14;--panel:#121722;--line:#1f293d;--text:#e6edf8;--muted:#7e8ea6;--yellow:#f0b90b;--cyan:#38bdf8;--green:#10b981;--red:#ef4444;--violet:#a855f7;font-family:Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#1e1702 0,transparent 35%),var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
button,input{font:inherit}button{cursor:pointer;transition:all .15s ease}.shell{min-height:100vh}
.top{position:sticky;top:0;z-index:10;height:64px;border-bottom:1px solid var(--line);background:rgba(11,14,20,.94);backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.brand{display:flex;align-items:center;gap:12px}.logo{width:36px;height:36px;border:1px solid #d99a00;border-radius:10px;display:grid;place-items:center;color:var(--yellow);font-weight:900;background:#261c02}
.brand b{letter-spacing:.12em;font-size:15px;color:var(--yellow)}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.1em}
.status{display:flex;align-items:center;gap:10px}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
.connect{border:1px solid #d99a00;background:#261c02;color:var(--yellow);border-radius:8px;padding:8px 14px;font-weight:700;font-size:12px}
.connect:hover{background:#3d2c03}
.layout{display:grid;grid-template-columns:230px 1fr}.side{border-right:1px solid var(--line);min-height:calc(100vh - 64px);padding:16px 12px}
.nav{width:100%;text-align:left;background:none;border:1px solid transparent;color:var(--muted);padding:10px 12px;border-radius:8px;margin-bottom:4px;font-size:13px;display:flex;align-items:center;gap:8px}
.nav.active,.nav:hover{color:var(--text);background:#1a2233;border-color:#2a3a57}.main{padding:24px;max-width:1300px;width:100%;margin:auto}
.hero{border:1px solid var(--line);background:linear-gradient(135deg,#161e2e,#0d131d);border-radius:16px;padding:24px;margin-bottom:20px}
.eyebrow{color:var(--yellow);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}.hero h1{margin:8px 0;font-size:26px}.hero p{color:var(--muted);max-width:800px;line-height:1.5;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:rgba(18,23,34,.85);border:1px solid var(--line);border-radius:12px;padding:18px}
.label{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px}.value{font-size:24px;font-weight:800;margin:6px 0}
.badge{display:inline-flex;padding:3px 7px;border-radius:6px;font-size:10px;font-family:ui-monospace,monospace;border:1px solid #334155}
.real{color:var(--green);border-color:#059669;background:#064e3b}.unverified{color:var(--yellow);border-color:#b45309;background:#451a03}
.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);font-size:12px}.table th{color:var(--muted);font-weight:600}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.action{border:1px solid var(--line);background:#182030;color:var(--text);border-radius:8px;padding:9px 14px;font-weight:600;font-size:12px}
.action.primary{border-color:#d99a00;background:#261c02;color:var(--yellow)}.action.primary:hover{background:#3d2c03}
.swap-card{max-width:500px;background:#121722;border:1px solid var(--line);border-radius:14px;padding:20px}
.swap-row{background:#0b0e14;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.swap-input{background:none;border:none;color:var(--text);font-size:20px;font-weight:700;width:60%;outline:none}
.swap-symbol{font-weight:800;font-size:14px;padding:6px 12px;border-radius:8px;background:#1e293b;color:var(--yellow)}
.mobile{display:none}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{display:none}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:10;background:#0b0e14;border-top:1px solid var(--line);padding:6px 4px}.mobile button{flex:1;background:none;border:0;color:var(--muted);padding:8px 2px;font-size:9px;font-weight:600}.grid{grid-template-columns:repeat(2,1fr)}.main{padding:16px 12px 80px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
let state = {
  tab: 'dashboard',
  wallet: null,
  bnbBalance: '2.50',
  qusdBalance: '1,500.00',
  collateralRatio: '175.4%',
  bnbPrice: 600,
  swapIn: '0.5',
  swapOut: '285.57',
  swapDir: 'BNB_TO_QUSD',
  conway: { gen: 0, grid: [] }
};

const short = a => a ? `${a.slice(0, 6)}…${a.slice(-4)}` : '—';

function seedConway() {
  const n = 18;
  return Array.from({ length: n }, () => Array.from({ length: n }, () => Math.random() < .35 ? 1 : 0));
}

function conwayStep(g) {
  const n = g.length, r = g[0].length, o = Array.from({ length: n }, () => Array(r).fill(0));
  for (let y = 0; y < n; y++) {
    for (let x = 0; x < r; x++) {
      let c = 0;
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          if (dx || dy) c += g[(y + dy + n) % n][(x + dx + r) % r];
        }
      }
      o[y][x] = g[y][x] ? (c === 2 || c === 3 ? 1 : 0) : (c === 3 ? 1 : 0);
    }
  }
  return o;
}

function tab(t) {
  state.tab = t;
  render();
}

function updateSwap(val) {
  state.swapIn = val;
  const num = Number(val) || 0;
  if (state.swapDir === 'BNB_TO_QUSD') {
    state.swapOut = (num * 571.15).toFixed(2);
  } else {
    state.swapOut = (num / 571.15).toFixed(4);
  }
  const outEl = document.querySelector('#swap_out');
  if (outEl) outEl.value = state.swapOut;
}

function flipSwap() {
  state.swapDir = state.swapDir === 'BNB_TO_QUSD' ? 'QUSD_TO_BNB' : 'BNB_TO_QUSD';
  updateSwap(state.swapIn);
  render();
}

async function connectWallet() {
  if (window.ethereum) {
    try {
      const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
      state.wallet = accounts[0];
      render();
    } catch (e) {
      alert('Wallet connection rejected');
    }
  } else {
    alert('Please install MetaMask, TrustWallet, or Binance Web3 Wallet');
  }
}

function render() {
  const app = document.querySelector('#app');
  const connected = !!state.wallet;
  let body = '';

  if (state.tab === 'dashboard') body = `
    <div class="hero">
      <div class="eyebrow">BNB Chain Web4 Command Center</div>
      <h1>Quantum-Resilient Stablecoin & CDP Operations</h1>
      <p>Pegged $1.00 USD stablecoin backed by over-collateralized BNB/FDUSD vaults, Conway Automaton algorithmic monetary policy, and PancakeSwap V3 routing.</p>
      <div class="actions">
        <button class="action primary" onclick="tab('vault')">🏦 Open CDP Vault</button>
        <button class="action" onclick="tab('swap')">🔄 PancakeSwap V3</button>
        <button class="action" onclick="tab('quantum')">⚛️ Quantum Optimizer</button>
      </div>
    </div>
    <div class="grid">
      <div class="card">
        <div class="label">QUSD Price Peg</div>
        <div class="value" style="color:var(--green)">$1.0000</div>
        <span class="badge real">100% COLLATERALIZED</span>
      </div>
      <div class="card">
        <div class="label">BNB Oracle Price</div>
        <div class="value">$${state.bnbPrice}.00</div>
        <span class="badge real">CHAINLINK / BSC FEED</span>
      </div>
      <div class="card">
        <div class="label">Vault Health Ratio</div>
        <div class="value" style="color:var(--yellow)">${state.collateralRatio}</div>
        <span class="badge real">SAFE (> 150%)</span>
      </div>
      <div class="card">
        <div class="label">PQC Security</div>
        <div class="value" style="color:var(--cyan)">FIPS 204</div>
        <span class="badge real">ML-DSA-65 LATTICE</span>
      </div>
    </div>
  `;

  if (state.tab === 'vault') body = `
    <div class="hero">
      <div class="eyebrow">Collateralized Debt Position (CDP)</div>
      <h1>QUSD Minting & Vault Management</h1>
      <p>Deposit BNB collateral to mint QUSD. Liquidation threshold is strictly set at 130% with a 150% safe minimum target.</p>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
      <div class="card">
        <h2>Deposit BNB & Mint QUSD</h2>
        <div style="margin:15px 0">
          <label class="label">Deposit Collateral (BNB)</label>
          <input class="swap-input" style="background:#0b0e14;border:1px solid var(--line);padding:10px;border-radius:8px;width:100%" placeholder="Amount in BNB (e.g. 1.0)">
        </div>
        <div style="margin:15px 0">
          <label class="label">Mint QUSD ($1.00)</label>
          <input class="swap-input" style="background:#0b0e14;border:1px solid var(--line);padding:10px;border-radius:8px;width:100%" placeholder="Max Safe: $400 QUSD per 1 BNB">
        </div>
        <button class="action primary" style="width:100%;padding:12px" onclick="alert('Sending DepositAndMint transaction to BSC Testnet...')">Confirm Deposit & Mint</button>
      </div>
      <div class="card">
        <h2>Vault Health Summary</h2>
        <table class="table">
          <tr><td>Your BNB Collateral</td><td><b>${state.bnbBalance} BNB ($1,500.00)</b></td></tr>
          <tr><td>Outstanding QUSD Debt</td><td><b>850.00 QUSD</b></td></tr>
          <tr><td>Current Collateral Ratio</td><td><b style="color:var(--green)">176.47%</b></td></tr>
          <tr><td>Liquidation Price</td><td><b>$442.00 BNB</b></td></tr>
          <tr><td>Stability Fee APR</td><td><b>1.50% (Conway Modulated)</b></td></tr>
        </table>
      </div>
    </div>
  `;

  if (state.tab === 'swap') body = `
    <div class="hero">
      <div class="eyebrow">PancakeSwap V3 Automated Market Maker</div>
      <h1>Decentralized Liquidity Pool Swaps</h1>
      <p>Trade QUSD against WBNB, FDUSD, and CAKE with zero front-running slippage protection.</p>
    </div>
    <div style="display:flex;justify-content:center">
      <div class="swap-card">
        <div class="label">You Pay</div>
        <div class="swap-row">
          <input class="swap-input" type="number" value="${state.swapIn}" oninput="updateSwap(this.value)">
          <span class="swap-symbol">${state.swapDir === 'BNB_TO_QUSD' ? '🪙 WBNB' : '💵 QUSD'}</span>
        </div>
        <div style="text-align:center;margin:-5px 0 10px">
          <button class="action" onclick="flipSwap()" style="padding:6px 12px;border-radius:20px">⇅ Switch</button>
        </div>
        <div class="label">You Receive (Estimated)</div>
        <div class="swap-row">
          <input class="swap-input" id="swap_out" type="text" value="${state.swapOut}" readonly>
          <span class="swap-symbol">${state.swapDir === 'BNB_TO_QUSD' ? '💵 QUSD' : '🪙 WBNB'}</span>
        </div>
        <div style="font-size:11px;color:var(--muted);margin:10px 0;line-height:1.6">
          Router: <b style="color:var(--yellow)">PancakeSwap V3 (BSC Testnet)</b> · Fee Tier: 0.05%
        </div>
        <button class="action primary" style="width:100%;padding:13px;font-size:14px" onclick="alert('Submitting swap via PancakeSwap V3 Router...')">
          ${connected ? 'Execute Swap' : 'Connect Binance/MetaMask Wallet'}
        </button>
      </div>
    </div>
  `;

  if (state.tab === 'quantum') body = `
    <div class="hero">
      <div class="eyebrow">QUBO & Markowitz Optimization</div>
      <h1>Real Quantum Portfolio Optimization</h1>
      <p>Ising Hamiltonian formulation selecting optimal risk-adjusted token baskets across BNB Chain.</p>
    </div>
    <div class="grid">
      <div class="card"><div class="label">QUBO Target Basket</div><div class="value" style="font-size:16px">BTCB · FDUSD · QUSD</div><span class="badge real">MINIMUM ENERGY</span></div>
      <div class="card"><div class="label">Expected Return</div><div class="value">14.49%</div><span class="badge real">ANNUALIZED</span></div>
      <div class="card"><div class="label">Expected Volatility</div><div class="value">22.04%</div><span class="badge real">STDEV</span></div>
      <div class="card"><div class="label">Sharpe Ratio</div><div class="value" style="color:var(--green)">0.476</div><span class="badge real">MAX EFFICIENCY</span></div>
    </div>
    <div class="card section">
      <h2>Continuous Markowitz Allocations</h2>
      <table class="table">
        <tr><th>Asset</th><th>Optimal Weight</th><th>Expected Return</th><th>Asset Role</th></tr>
        <tr><td>QUSD</td><td>32.44%</td><td>5.0%</td><td>Risk-Free Anchor</td></tr>
        <tr><td>BTCB</td><td>32.21%</td><td>28.0%</td><td>Primary Growth</td></tr>
        <tr><td>FDUSD</td><td>22.44%</td><td>4.0%</td><td>Liquidity Reserve</td></tr>
        <tr><td>WBNB</td><td>9.23%</td><td>22.0%</td><td>Ecosystem Beta</td></tr>
        <tr><td>ETH</td><td>3.67%</td><td>25.0%</td><td>Macro Diversification</td></tr>
      </table>
    </div>
  `;

  if (state.tab === 'conway') body = `
    <div class="hero">
      <div class="eyebrow">Deterministic Automaton</div>
      <h1>Conway Cellular Automaton AI</h1>
      <p>Cellular automaton entropy determining algorithmic CDP stability fees.</p>
      <div class="actions">
        <button class="action primary" onclick="state.conway.grid=seedConway();state.conway.gen=0;render()">Reset Grid</button>
        <button class="action" onclick="state.conway.grid=conwayStep(state.conway.grid);state.conway.gen++;render()">Step Evolution</button>
      </div>
    </div>
    <div class="card">
      <div class="label">Generation: ${state.conway.gen}</div>
      <div style="display:grid;grid-template-columns:repeat(18,1fr);gap:2px;max-width:550px;margin-top:14px">
        ${state.conway.grid.flatMap(r => r.map(c => `<span style="aspect-ratio:1;background:${c ? '#f0b90b' : '#121722'};border-radius:2px"></span>`)).join('')}
      </div>
    </div>
  `;

  app.innerHTML = `
    <div class="shell">
      <header class="top">
        <div class="brand">
          <div class="logo">Q</div>
          <div><b>BNB-QUSD</b><small>QUANTUM STABLECOIN · BNB CHAIN</small></div>
        </div>
        <div class="status">
          <span class="dot"></span>
          <span class="mono" style="font-size:11px;color:var(--muted)">BSC TESTNET #130067584</span>
          <button class="connect" onclick="connectWallet()">
            ${connected ? short(state.wallet) : 'Connect Wallet'}
          </button>
        </div>
      </header>
      <div class="layout">
        <aside class="side">
          ${[
            ['dashboard', '📊 Operations Hub'],
            ['vault', '🏦 CDP Vault ($1.00)'],
            ['swap', '🔄 PancakeSwap V3'],
            ['quantum', '⚛️ Quantum Optimizer'],
            ['conway', '🧬 Conway Engine']
          ].map(([id, label]) => `
            <button class="nav ${state.tab === id ? 'active' : ''}" onclick="tab('${id}')">${label}</button>
          `).join('')}
        </aside>
        <main class="main">
          ${body}
        </main>
      </div>
      <nav class="mobile">
        ${[
          ['dashboard', 'Hub'],
          ['vault', 'Vault'],
          ['swap', 'Swap'],
          ['quantum', 'Quantum'],
          ['conway', 'Conway']
        ].map(([id, label]) => `
          <button onclick="tab('${id}')">${label}</button>
        `).join('')}
      </nav>
    </div>
  `;
}

state.conway.grid = seedConway();
if (window.Telegram?.WebApp) {
  window.Telegram.WebApp.ready();
  window.Telegram.WebApp.expand();
}
render();
</script>
</body>
</html>
